services:
  postgres:
    image: postgres:16-alpine
    container_name: austral-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-austral_estoque}
      POSTGRES_USER: ${POSTGRES_USER:-austral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - austral-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-austral} -d ${POSTGRES_DB:-austral_estoque}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: austral-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - austral-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: austral-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-austral_estoque}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-austral}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      AUTH_MODE: ${AUTH_MODE:-JWT}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_DN_PATTERN: ${LDAP_USER_DN_PATTERN:-}
      SPRING_MAIL_HOST: ${MAIL_HOST:-}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@austral.com}
      NOTIFICATION_WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      NOTIFICATION_WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      NOTIFICATION_WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      NOTIFICATION_SMS_ENABLED: ${SMS_ENABLED:-false}
      NOTIFICATION_TWILIO_SID: ${TWILIO_SID:-}
      NOTIFICATION_TWILIO_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      NOTIFICATION_TWILIO_FROM: ${TWILIO_FROM_PHONE:-}
      INTEGRATION_ERP_ENABLED: ${ERP_ENABLED:-false}
      INTEGRATION_ERP_URL: ${ERP_URL:-}
      INTEGRATION_ERP_TOKEN: ${ERP_TOKEN:-}
      APP_FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      APP_SEED_ADMIN_EMAIL: ${APP_SEED_ADMIN_EMAIL:-admin@austral.com}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - austral-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: austral-frontend
    networks:
      - austral-net
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.25-alpine
    container_name: austral-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - austral-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  austral-net:
    driver: bridge
