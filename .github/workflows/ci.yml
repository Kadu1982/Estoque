name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn test

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  scripts:
    name: Script Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bash scripts syntax
        run: |
          bash -n infra/scripts/deploy.sh
          bash -n infra/scripts/smoke-test.sh
          bash -n infra/scripts/backup-db.sh
          bash -n infra/scripts/restore-db.sh
          bash -n infra/scripts/go-no-go.sh
          bash -n infra/scripts/staging-rehearsal.sh

      - name: Validate docker compose files
        run: |
          cp .env.production.example .env.production
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production config >/dev/null
