spring:
  application:
    name: austral-estoque

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/austral_estoque}
    username: ${SPRING_DATASOURCE_USERNAME:austral}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      maximum-pool-size: 20          # ← Ajustado conforme plano
      minimum-idle: 10               # ← Alterado de 5 para 10 (perna inicial)
      connection-timeout: 10000      # ← Reduzido de 30000 para 10000ms (Hikari + Virtual Threads)
      keepalive-time: 30000          # ← Adicionado
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true   # ✅ movido para dentro de jdbc
          order_updates: true   # ✅ recomendado junto com batch

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    ldap:
      repositories:
        enabled: false
    redis:
      repositories:
        enabled: false
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  mail-from: ${MAIL_FROM:noreply@austral.com}

  cache:
    type: redis

security:
  jwt:
    secret: ${JWT_SECRET:dev_secret_key_change_in_production_min_64_chars_here_ok}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  auth-mode: ${AUTH_MODE:JWT}
  oauth2:
    issuer-uri: ${OAUTH2_ISSUER_URI:}
  ldap:
    url: ${LDAP_URL:}
    base-dn: ${LDAP_BASE_DN:}
    user-dn-pattern: ${LDAP_USER_DN_PATTERN:uid={0},ou=people}

notification:
  whatsapp:
    enabled: ${NOTIFICATION_WHATSAPP_ENABLED:false}
    api-url: ${NOTIFICATION_WHATSAPP_API_URL:}
    token: ${NOTIFICATION_WHATSAPP_TOKEN:}
  sms:
    enabled: ${NOTIFICATION_SMS_ENABLED:false}
    twilio-sid: ${NOTIFICATION_TWILIO_SID:}
    twilio-token: ${NOTIFICATION_TWILIO_TOKEN:}
    twilio-from: ${NOTIFICATION_TWILIO_FROM:}

integration:
  erp:
    enabled: ${INTEGRATION_ERP_ENABLED:false}
    url: ${INTEGRATION_ERP_URL:}
    token: ${INTEGRATION_ERP_TOKEN:}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  seed:
    admin-email: ${APP_SEED_ADMIN_EMAIL:admin@austral.com}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:Admin@123456}

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.austral.estoque: INFO
    org.springframework.security: INFO
